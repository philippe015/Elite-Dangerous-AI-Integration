name: Build Linux Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binary
    # Utilisation de ubuntu-20.04 pour garantir la compatibilité avec SteamOS (Steam Deck)
    # Si on utilise 'latest', le binaire risque de ne pas se lancer sur des Linux plus anciens.
    runs-on: ubuntu-20.04

    steps:
    # 1. Récupération du code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Installation des librairies Linux Audio (Indispensable pour ce projet)
    # Sans 'portaudio19-dev', l'installation de PyAudio plantera.
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev libasound2-dev portaudio19-dev libffi-dev gcc

    # 3. Installation de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Active le cache automatiquement pour accélérer les futurs builds

    # 4. Installation des dépendances du projet
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # 5. Compilation de l'exécutable (La partie critique)
    # Nous passons tous les arguments ici pour ne pas avoir à modifier de fichiers.
    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --clean \
        --name "COVAS_NEXT_Linux" \
        --hidden-import "engineio.async_drivers.aiohttp" \
        --hidden-import "socketio" \
        --collect-all "speech_recognition" \
        --collect-all "certifi" \
        main.py

    # 6. Sauvegarde et mise à disposition du fichier final
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: COVAS_NEXT_Linux_Binary
        path: dist/COVAS_NEXT_Linux
